[project]
name = "harness"
version = "0.1.0"
description = "Hangul: A secure personal agent that researches, reads your documents and inbox, and takes action for you once you approve."
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Aasim Malik" }]

# Step 1 declares ONLY what the skeleton needs to walk. Dependencies grow as you
# thicken: anthropic at step 4, langgraph at step 7, pgvector at step 9, and so on.
# Keeping this minimal keeps the step-1 image small and the build fast.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "structlog>=24.1",
    "openai>=1.50",
    "jsonschema>=4.23",
    "cryptography>=42",
    "httpx>=0.27",
    "mcp>=1.28",
    "pypdf",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "fpdf2>=2.8",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "numpy",
    "streamlit>=1.60",
    "requests>=2.32",
    "sqlalchemy>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "redis>=5.0",
    "pyjwt>=2.9",
    "pgvector>=0.3",
    "pywebpush>=2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# src layout: the importable package is src/harness, imported as `harness`.
[tool.setuptools.packages.find]
where = ["src"]

# include non-Python data files (prompt templates) in the installed package
[tool.setuptools.package-data]
"harness.prompts" = ["templates/*.txt"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[project.optional-dependencies]
dev = [
    "locust>=2.0",   
    "ruff",          
    "pytest>=8.0",  
    "psycopg[binary]>=3.2",
    "sse-starlette>=2.1",
]
