<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hangul — offline</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #FFFFFF; color: #16191C;
         font: 15px/1.5 system-ui, -apple-system, Segoe UI, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  img { width: 72px; height: 72px; border-radius: 16px; }
  h1 { font-size: 20px; font-weight: 500; margin: 18px 0 6px; }
  p { color: #9A9AA0; margin: 0 0 20px; }
  button { background: #A8402C; color: #FFFFFF; border: 0; border-radius: 999px; padding: 10px 18px; font: inherit; cursor: pointer; }
</style>
</head>
<body>
  <div>
    <img src="/icons/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>Hangul needs a connection to answer. Your chats and lists are safe and will be back as soon as you are.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
